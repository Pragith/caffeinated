name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Version
        id: version
        run: |
          VERSION="$(cat VERSION)"
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          test "$TAG_VERSION" = "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build App
        run: |
          xcodebuild -project caffeinated/caffeinated.xcodeproj -scheme caffeinated -configuration Release -sdk macosx -derivedDataPath caffeinated/build CODE_SIGNING_ALLOWED=NO build
          mkdir -p caffeinated/release
          cp -R caffeinated/build/Build/Products/Release/caffeinate-d.app caffeinated/release/

      - name: Create DMG
        run: |
          hdiutil create -volname "Caffeinated" -srcfolder caffeinated/release -ov -format UDZO Caffeinated_${{ steps.version.outputs.VERSION }}.dmg

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: Caffeinated_${{ steps.version.outputs.VERSION }}.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
